services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ${LIEMA_IMAGE:-liema-auto:local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    command: ["uvicorn", "auto_test.web:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment: &liema-environment
      LIEMA_ENV: production
      LIEMA_SESSION_COOKIE_SECURE: ${LIEMA_SESSION_COOKIE_SECURE:-false}
      LIEMA_MASTER_KEY: ${LIEMA_MASTER_KEY:?LIEMA_MASTER_KEY must be set}
      LIEMA_TASK_QUEUE_BACKEND: redis
      LIEMA_TASK_EXECUTION_MODE: external
      LIEMA_REDIS_URL: redis://redis:6379/0
      LIEMA_DATABASE_BACKEND: ${LIEMA_DATABASE_BACKEND:-sqlite}
      LIEMA_MYSQL_HOST: ${LIEMA_MYSQL_HOST:-127.0.0.1}
      LIEMA_MYSQL_PORT: ${LIEMA_MYSQL_PORT:-3306}
      LIEMA_MYSQL_DATABASE: ${LIEMA_MYSQL_DATABASE:-liema_automation_test}
      LIEMA_MYSQL_USER: ${LIEMA_MYSQL_USER:-liema_test}
      LIEMA_MYSQL_PASSWORD: ${LIEMA_MYSQL_PASSWORD:-}
      LIEMA_ARTIFACT_BACKEND: ${LIEMA_ARTIFACT_BACKEND:-local}
      LIEMA_MINIO_ENDPOINT: ${LIEMA_MINIO_ENDPOINT:-127.0.0.1:9000}
      LIEMA_MINIO_ACCESS_KEY: ${LIEMA_MINIO_ACCESS_KEY:-}
      LIEMA_MINIO_SECRET_KEY: ${LIEMA_MINIO_SECRET_KEY:-}
      LIEMA_MINIO_BUCKET: ${LIEMA_MINIO_BUCKET:-liema-test-artifacts}
      LIEMA_MINIO_SECURE: ${LIEMA_MINIO_SECURE:-false}
    volumes: &liema-volumes
      - liema-data:/app/data
      - liema-runtime:/app/runtime
      - liema-artifacts:/app/artifacts
      - liema-instance:/app/instance
      - liema-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ${LIEMA_IMAGE:-liema-auto:local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    command: ["python", "-m", "auto_test.worker"]
    restart: unless-stopped
    environment: *liema-environment
    volumes: *liema-volumes
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  liema-data:
  liema-runtime:
  liema-artifacts:
  liema-instance:
  liema-logs:
